quests:
  firstMessage:
    title: "Say Hii in #welcome"
    description: "The community is very welcoming, send a message to introduce yourself and receive a warm welcome!"
    url: https://hackclub.slack.com/archives/C75M7C0SY
    tutorialActionId: "tutorial-welcome-message"
    tutorial:
      - description: |
          Go to the #welcome channel and type up a message! You can explain your hobbies, schoo, where you live, favourite item, whatever :D.
        image: https://cloud-o1q86dpri-hack-club-bot.vercel.app/0image.png
        imageAlt: "welcome channel screenshot"
      - description: |
          Send your messages as one, or thread your other messages :D. To open a thread, click on the thread button beside a message or click on the `x replies` buttons which appears if others have started a thread.
          
          You'll figure out when is the right time to thread with time, but generally thread:
          - Big bricks of text
          - Side topics not being discussed in the main channel
          - When talking with others already in a thread
          - Where you see a :thread: emoji at the top, to the right of the channel name

          Why thread? Threading keeps a channel more organized and makes it more readable for others :). No worries if you don't quite get it, others will kindly let you know by telling you or reacting with a :thread: emoji.

          (Circled in red is where you can reply to a thread)
        image: https://cloud-8yzzptt80-hack-club-bot.vercel.app/0screenshot_2025-02-02_at_8.07.44___pm.png
        imageAlt: "a screenshot of a thread"

    
  joinChannel:
    title: ":hash_1: Join A Channel"
    description: "Join a Channel! Channels are where people send messages and stuff."
    tutorialActionId: "tutorial-join-first-channel"
    tutorial:
    - description: |
        Here are some places where you can find channels:

        - #library: You can see where people are active!
        - #neighborhood: See people advertising their channels.
        - #happenings: See what events are happening and channels you can join for cool stuff.

        To join a channel, simply click on any channel (any highlighted in blue) and you'll see a green `Join Channel` button at the bottom muddle. Click it! That prompt will disappear if you open any channels you're already in.
      image: https://cloud-cnxlyx32q-hack-club-bot.vercel.app/0image.png
      imageAlt: "to join a channel click the green button"


  setProfilePicture:
    title: "Set a Profile Picture"
    description: "Profile pictures are great! It doesn't have to be your face, it could be a show you like, maybe some flowers :D."
    tutorialActionId: "tutorial-set-profile-picture"
    tutorial:
      - description: "Click on your profile on the very botton left corner. Then click on the `Profile` button." 
        image: https://cloud-ridnw9sb7-hack-club-bot.vercel.app/0image.png
        imageAlt: "profile button"
      - description: |
          You'll notice 3 edit buttons. 

          - The first is for your bio, just anything about you. You can also change your pronouns and add a pronunciation of your name :D.
          - The second is for your phone number. You can either add your actual phone number, or just leave any additional message like "DM me!" or an email.
          - The third is really the good part :D. Here you can add a lot about yourself, add what you want and make it fun! There are sections for everything from your website, to your #scrapbook link, all the way to dogs or cats.
        image: https://cloud-qyt5pnyzg-hack-club-bot.vercel.app/0image.png
        imageAlt: "profile button"
  
  firstShip:
    title: ":shipitparrot: Ship Something"
    description: "Hack Club is a place to make cool stuff! Create a cool project (think websites, games, tools, anything code!) and share it with the world!"
    url: https://hackclub.slack.com/archives/C0M8PUPU6

messagesActionId: "btn-messages-tab"
findGarbage: 
  - "_you hear some scurrying in a back alley..._ \n you go down the alley and find a garbage can. _rustle rustle_" 

openGarbage:
  - "A RACOON JUMPS OUT OF THE GARBAGE CAN :rac_woah:\n
    \n
    _the raccoon introduces herself_\n
    \n    
    \":rac_yap: hii hii! i'm heidi the hakkuun! i'll be your guide throughout the slack!\n
    but but before I let you wander off on your own, i wanna show you some stuff :rac_info:\"
    "

codeOfConduct:
  - |
    _the raccoon rummages through the garbage and pulls out a piece of paper_
    
    _she hands it to you_
    
    "this is the code of conduct! it's very very important to follow these rules while you're here!
    
    _you look at the paper and see the following rules_
    
    > The tenants of the Hack Club Slack (Abridged 12th ed.) Orpheus et al.
  
    > Treat everyone with respect and kindness.
    > Be thoughtful in how you communicate.
    > Don't advertise outside of <#C01GPEL6CGM>.
    > Above all else, please follow the Hacker Values.
    
    _at the bottom, you see a hastily written note. it looks like a link: https://hackclub.com/conduct/ _

    do you agree to abide by the code of conduct? :rac_shy:

acceptedCodeOfConduct:
  - |
    horray! :rac_woah:

    _she pulls out a party hat and puts it on your head_

    now let me show you around this place!
    - <#C0266FRGT> is where big news and cool events are announced!
    - <#C75M7C0SY> is where you can inroduce yourself! say hi!
    - <#C05B6DBN802> is where you can learn about everything happening around the slack!
    - <#C01AS1YEM8A> is where you can find new channels and meet new people!
    - <#C0266FRGV> is where people go to hang out and talk!

    the slack is big and there's a lot to see! but don't worry, you'll figure it out :rac_info:

    (If you want a quick tutorial though, check out <https://hackclub.slack.com/canvas/C07PPK84JUB|this canvas>)!
# show the user more later on

slackTutorial:
  - |
    yay yay! it's time to explore the slack! :rac_woah:
    i've given you 3 quests to do! each quest will show you an aspect of the slack and some cool things you can do. 
    
    meet me at the home tab by clicking the home button on the top left :rac_info:

questsTutorialComplete:
  - |
    yay yay! you've completed the tutorial! :rac_woah:

    _the raccoon hands you a sheet of paper_

    i've handed you some more quests on your journey throught the slack! 
    each quest will show you a different aspect of the slack and some cool things you can do.
    now off you go and explore the slack! i'll come around some time to check up on you and let you know of any new quests and going ons! :rac_info:

    _the raccoon waves goodbye and scurries off_

    _you hear a faint \"yap yap!\" in the distance_


